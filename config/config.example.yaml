# Project configuration.
# config.py loads config/config.yaml if it exists, otherwise this example file.
# To use personal settings, copy this file to config/config.yaml and edit it.

paths:                      # relative to the project root
  raw_data: "data/raw/reviews.csv"
  processed_data: "data/processed/clean_reviews.csv"
  model: "models/sentiment_model.joblib"
  figures_dir: "outputs/figures"
  reports_dir: "outputs/reports"

columns:                    # must match the CSV header exactly
  title: "Title"
  text: "Review Text"
  rating: "Rating"
  categories:
    - "Division Name"
    - "Department Name"
    - "Class Name"

labels:                     # rating -> sentiment
  negative_max: 2           # rating <= 2 -> negative
  positive_min: 4           # rating >= 4 -> positive; anything between -> neutral

cleaning:
  valid_ratings: [1, 2, 3, 4, 5]
  min_text_chars: 3
  unknown_category: "Unknown"
  drop_columns: ["Age"]

model:
  test_size: 0.2
  random_state: 42
  max_features: 20000
  ngram_range: [1, 2]
  C: 1.0
  class_weight: "balanced"  # reviews are mostly positive

llm:
  models:
    - "deepseek-ai/DeepSeek-V4.1-Flash"
  reasoning_effort: "none"
  temperature: 0
  max_tokens: 16
  timeout_seconds: 60
  max_retries: 4
  workers: 4
  sample_per_class: 30
  issue_max_tokens: 200
  issue_categories:
    fit: "garment shape or cut does not suit the body (too tight, too loose, boxy, unflattering, too short or long)"
    size: "sizing runs small or large, or the size label does not match the actual size"
    fabric: "material feel or look (scratchy, thin, see-through, stiff, cheap-feeling, pilling, wrinkles)"
    quality: "construction or durability (seams, zipper, buttons, stitching, fading, shrinking, falling apart)"
    color: "colour or pattern differs from the photo, or looks unattractive"
    price: "poor value for the money or too expensive for what it is"
    comfort: "uncomfortable to wear (itchy, restrictive, heavy, hot)"
    service: "shipping, delivery, packaging, wrong item, returns or customer service"
    other: "a real complaint that fits none of the categories above"

issues:
  top_n_terms: 15
  min_category_reviews: 30

logging:
  level: "INFO"
  file: "logs/app.log"
